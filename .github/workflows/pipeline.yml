name: Build e testes da somativa
on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compilar e testar os dois exercícios
        run: mvn -B verify
      - name: Disponibilizar JAR e testes do monitoramento
        uses: actions/upload-artifact@v4
        with:
          name: monitoramento
          path: |
            exercicio1-monitoramento-maquinas/target/*.jar
            exercicio1-monitoramento-maquinas/target/surefire-reports/TEST-*.xml
          if-no-files-found: error
      - name: Disponibilizar JAR e testes da biblioteca
        uses: actions/upload-artifact@v4
        with:
          name: biblioteca
          path: |
            exercicio2-biblioteca/target/*.jar
            exercicio2-biblioteca/target/surefire-reports/TEST-*.xml
          if-no-files-found: error
